name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '仅上传 Gitee（已构建的 tag，如 v0.3.0）'
        required: false
  push:
    tags:
      - 'v*'

# 默认 GITHUB_TOKEN 只有读权限，需要显式声明 contents: write 才能创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 手动触发且指定 tag 时跳过构建（只走 upload-gitee job）
    if: ${{ !inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      # 配置 release 签名：从 GitHub Secret 解码 keystore 并生成 key.properties
      # 没有配置 secret 时跳过此步，构建会回退到 debug 签名（本地开发场景）
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        # KEYSTORE_BASE64 非空才执行（用 shell 判断，比 if 表达式更可靠）
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠ KEYSTORE_BASE64 未配置，将使用 debug 签名（无法覆盖安装正式版）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "✓ release.keystore 已生成"
          ls -la android/app/release.keystore

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signature & print cert fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APK=$(ls build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>/dev/null \
                  || ls build/app/outputs/flutter-apk/*-release.apk | head -1)
          echo "校验 APK: $APK"
          # 定位 apksigner（Android SDK build-tools 下）
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /usr/lib/android-sdk -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "⚠ 未找到 apksigner，跳过签名指纹打印"
            exit 0
          fi
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" || { echo "✗ APK 签名校验失败"; exit 1; }
          echo "✓ APK 签名校验通过"
          echo "--- 签名证书指纹（应与本地 release.keystore 一致）---"
          "$APKSIGNER" verify --print-certs --verbose "$APK" | grep -iE 'SHA-256| signer #|Certificate MD5|Certificate SHA-1|Certificate SHA-256' || true

      - name: Rename APKs with version + ABI
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          cd build/app/outputs/flutter-apk/
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            mv "$f" "book_reader-v${VERSION}-${abi}.apk"
          done
          ls -lh

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: book_reader-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 单独的 Gitee 上传 job：可独立重试
  # 触发条件：
  #   - tag push 后 build 完成（无论成功失败都尝试上传，build 失败时 GitHub Release 不会生成，
  #     下载步骤会失败但不会阻塞本 job 的执行流程）
  #   - 手动 workflow_dispatch 指定 tag（此时 build 被 if 跳过，直接从 GitHub Release 下载）
  upload-gitee:
    name: Upload APKs to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag) }}
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: duzou_5aidnf
      GITEE_REPO: novel-reader
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag & download APKs from GitHub Release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF##refs/tags/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "准备上传 tag $TAG 的 APK 到 Gitee"
          mkdir -p apks
          # 从 GitHub Release 下载该 tag 的所有 APK
          gh release download "$TAG" --dir apks --pattern '*.apk' --repo "$GITHUB_REPOSITORY"
          ls -lh apks/

      - name: Create / reuse Gitee Release & upload APKs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          # 1. 查找是否已有 release（避免重复创建）
          RELEASE_ID=$(curl -sS --max-time 30 \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "Gitee 上不存在 tag $TAG 的 release，创建新 release"
            RESP=$(curl -sS --max-time 30 -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"搜书看书 ${VERSION}\",\"target_commitish\":\"master\",\"prerelease\":false}")
            RELEASE_ID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
            if [ -z "$RELEASE_ID" ]; then
              echo "✗ Gitee release 创建失败: $RESP"
              exit 1
            fi
          fi
          echo "✓ 使用 Gitee release id=$RELEASE_ID"
          # 2. 列出 release 已有资产（避免重复上传同名文件，Gitee 不去重）
          EXISTING=$(curl -sS --max-time 30 \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}?access_token=${GITEE_TOKEN}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(f\"{a.get('id','')}|{a.get('name','')}\" for a in d.get('assets',[])))" 2>/dev/null || echo "")
          # 3. 逐个上传 APK（短超时 + 5 次重试 + 单文件失败不阻塞其他文件）
          # 之前用 600s 超时 + 3 次重试，跨境网络抖动时整个 job 超时挂死。
          # 现在用 180s 超时 + 5 次重试，单次快速失败，总重试时间最多 ~15 分钟，
          # 且单个 APK 失败不阻塞其他 APK（最后统计失败数）。
          # 注意：不要手动设置 -H "Content-Type: multipart/form-data"
          # curl -F 会自动生成带 boundary 的 Content-Type；手动覆盖会丢掉 boundary，
          # 导致 Gitee 服务端无法解析 multipart body，上传请求挂起直至超时。
          cd apks
          FAIL=0
          SUCCESS_COUNT=0
          for f in book_reader-*.apk; do
            # 跳过已存在同名文件（避免 Gitee 重复资产）
            if echo "$EXISTING" | grep -q "|${f}$"; then
              echo "✓ $f 已存在，跳过"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              continue
            fi
            echo "上传 $f ..."
            SUCCESS=0
            for ATTEMPT in 1 2 3 4 5; do
              UPLOAD_RESP=$(curl -sS --max-time 180 --connect-timeout 15 -X POST \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${f}" 2>&1)
              if echo "$UPLOAD_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'  ✓ (第{sys.argv[1]}次) {d.get(\"name\",\"?\")} -> {d.get(\"browser_download_url\",\"?\")}')" "$ATTEMPT" 2>/dev/null; then
                SUCCESS=1
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                break
              fi
              echo "  ⚠ 第 $ATTEMPT 次上传失败: $(echo "$UPLOAD_RESP" | head -c 200)"
              [ "$ATTEMPT" -lt 5 ] && sleep $((ATTEMPT * 5))
            done
            if [ "$SUCCESS" -eq 0 ]; then
              echo "  ✗ $f 5 次重试均失败"
              FAIL=$((FAIL + 1))
            fi
          done
          echo "✓ 上传完成: $SUCCESS_COUNT 成功, $FAIL 失败"
          if [ "$FAIL" -gt 0 ] && [ "$SUCCESS_COUNT" -eq 0 ]; then
            echo "✗ 全部 APK 上传失败，请重跑本 job（workflow_dispatch 指定 tag=$TAG）"
            exit 1
          fi
          echo "✓ 至少有一个 APK 上传成功，可继续（失败的可在下次重跑补齐）"

