name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 默认 GITHUB_TOKEN 只有读权限，需要显式声明 contents: write 才能创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      # 配置 release 签名：从 GitHub Secret 解码 keystore 并生成 key.properties
      # 没有配置 secret 时跳过此步，构建会回退到 debug 签名（本地开发场景）
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        # KEYSTORE_BASE64 非空才执行（用 shell 判断，比 if 表达式更可靠）
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠ KEYSTORE_BASE64 未配置，将使用 debug 签名（无法覆盖安装正式版）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "✓ release.keystore 已生成"
          ls -la android/app/release.keystore

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signature & print cert fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APK=$(ls build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>/dev/null \
                  || ls build/app/outputs/flutter-apk/*-release.apk | head -1)
          echo "校验 APK: $APK"
          # 定位 apksigner（Android SDK build-tools 下）
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /usr/lib/android-sdk -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "⚠ 未找到 apksigner，跳过签名指纹打印"
            exit 0
          fi
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" || { echo "✗ APK 签名校验失败"; exit 1; }
          echo "✓ APK 签名校验通过"
          echo "--- 签名证书指纹（应与本地 release.keystore 一致）---"
          "$APKSIGNER" verify --print-certs --verbose "$APK" | grep -iE 'SHA-256| signer #|Certificate MD5|Certificate SHA-1|Certificate SHA-256' || true

      - name: Rename APKs with version + ABI
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          cd build/app/outputs/flutter-apk/
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            mv "$f" "book_reader-v${VERSION}-${abi}.apk"
          done
          ls -lh

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: book_reader-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 同步创建 Gitee Release 并上传 APK（国内用户走 Gitee 更新）
      # 注意：GitHub Actions runner（美国/欧洲）到 Gitee（国内）的网络不稳定，
      # 大文件上传经常超时。设 continue-on-error 让构建不因此失败；
      # 上传失败时需手动从 GitHub Release 下载 APK 再上传到 Gitee。
      - name: Create Gitee Release & upload APKs (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: duzou_5aidnf
          GITEE_REPO: novel-reader
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "为 Gitee 创建 release: $TAG"
          # 1. 创建 release
          RESP=$(curl -sS -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"搜书看书 ${VERSION}\",\"target_commitish\":\"master\",\"prerelease\":false}")
          RELEASE_ID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "✗ Gitee release 创建失败: $RESP"
            exit 1
          fi
          echo "✓ Gitee release 已创建, id=$RELEASE_ID"
          # 2. 逐个上传 APK
          # 注意：不要手动设置 -H "Content-Type: multipart/form-data"
          # curl -F 会自动生成带 boundary 的 Content-Type；手动覆盖会丢掉 boundary，
          # 导致 Gitee 服务端无法解析 multipart body，上传请求挂起直至超时。
          cd build/app/outputs/flutter-apk/
          for f in book_reader-*.apk; do
            echo "上传 $f ..."
            # --max-time 60：GitHub runner 到 Gitee 网络不稳定，单次最多等 60s
            # --retry 1：最多重试 1 次（3 个 APK × 2 次 × 60s = 360s，远低于 job 超时）
            UPLOAD_RESP=$(curl -sS --max-time 60 --retry 1 --retry-delay 5 -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${f}" 2>&1) || { echo "  ✗ 上传 $f 失败（可手动补传）: $UPLOAD_RESP"; continue; }
            echo "$UPLOAD_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'  ✓ {d.get(\"name\",\"?\")} -> {d.get(\"browser_download_url\",\"?\")}')" 2>/dev/null || echo "  ⚠ $f 上传响应解析失败: $UPLOAD_RESP"
          done
          echo "✓ Gitee release 资产上传完成（失败项需手动补传）"
